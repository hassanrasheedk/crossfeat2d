[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossfeat2d"
version = "0.1.0"
description = "Learning to match 2D keypoints across preoperative MR and intraoperative ultrasound (ASMUS @ MICCAI 2024)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hassan Rasheed" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scikit-learn",
    "imageio",
    "lightglue @ git+https://github.com/cvg/LightGlue.git@v0.2",
]

[project.optional-dependencies]
notebooks = ["jupyter", "matplotlib", "scipy", "opencv-python", "torchvision", "nibabel"]
dev = ["pytest", "ruff"]

[project.scripts]
crossfeat2d = "crossfeat2d.cli:main"

[project.urls]
Paper = "https://doi.org/10.1007/978-3-031-73647-6_8"
arXiv = "https://arxiv.org/abs/2409.08169"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
